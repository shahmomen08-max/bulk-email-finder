<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Email Verifier - Shah Creative</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-bottom: 15px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        .results { margin-top: 20px; }
        .result-item { padding: 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; }
        .valid { background: #d4edda; color: #155724; }
        .invalid { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bulk Email Verifier</h1>
        <p>Ek line mein ek email enter karein (Snov.io style verification):</p>
        <textarea id="emailInput" placeholder="example1@domain.com&#10;example2@domain.com"></textarea>
        <button onclick="verifyEmails()">Verify Emails</button>
        
        <div class="results" id="resultsContainer"></div>
    </div>

    <script>
        async function verifyEmails() {
            const input = document.getElementById('emailInput').value;
            const emails = input.split('\n').map(e => e.trim()).filter(e => e);
            const container = document.getElementById('resultsContainer');
            container.innerHTML = 'Verifying...';

            if (emails.length === 0) {
                container.innerHTML = 'Kareeb kam az kam ek email toh enter karein!';
                return;
            }

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emails })
                });
                const data = await response.json();
                
                container.innerHTML = '';
                data.results.forEach(res => {
                    const div = document.createElement('div');
                    div.className = `result-item ${res.status}`;
                    div.innerHTML = `<span>${res.email}</span> <strong>${res.status.toUpperCase()}</strong>`;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = 'Verification mein koi error aa gaya hai.';
            }
        }
    </script>
</body>
</html>
