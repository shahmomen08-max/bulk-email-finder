<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Domain Email Finder & Verifier - Shah Creative</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success-bg: rgba(16, 185, 129, 0.1);
            --success-text: #34d399;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); }
        h1 { color: var(--text-main); text-align: center; margin-bottom: 8px; font-size: 26px; }
        p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }
        
        /* API Input Section */
        .api-section { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .api-input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .api-input-group input { width: 100%; padding: 10px; background: #1e293b; border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 13px; box-sizing: border-box; }
        .api-input-group input:focus { outline: none; border-color: var(--primary); }

        textarea { width: 100%; height: 160px; padding: 15px; border: 1px solid var(--border); background: #0f172a; color: var(--text-main); border-radius: 8px; font-size: 14px; margin-bottom: 15px; resize: vertical; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }
        
        .action-bars { display: flex; gap: 12px; margin-bottom: 20px; }
        button { background: var(--primary); color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; flex: 2; }
        button:hover { background: var(--primary-hover); }
        
        /* CSV Import Button */
        .csv-btn { background: #334155; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; color: white; font-weight: 600; }
        .csv-btn:hover { background: #475569; }
        #csvFileInput { display: none; }

        .results { margin-top: 30px; }
        .result-card { background: #0f172a; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; border-radius: 8px; animation: fadeIn 0.3s ease-in-out; }
        .domain-title { font-weight: 700; color: #38bdf8; margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .email-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .email-tag { display: inline-flex; align-items: center; background: var(--success-bg); color: var(--success-text); border: 1px solid rgba(52, 211, 153, 0.2); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-family: monospace; }
        .no-email { color: #f43f5e; font-style: italic; font-size: 14px; background: rgba(244, 63, 94, 0.1); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(244, 63, 94, 0.2); display: inline-block; }
        .loading { text-align: center; color: var(--text-muted); font-style: italic; padding: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bulk Domain Email Finder</h1>
        <p class="subtitle">Guest posting ke liye websites ki active emails bulk mein extract karein (Shah Creative)</p>
        
        <!-- API Keys Section -->
        <div class="api-section">
            <div class="api-input-group">
                <label for="serperKey">Serper API Keys (Multiple keys comma-separated lagayein)</label>
                <input type="text" id="serperKey" value="2deb2e45775a3712192d77cfca6031eeff8105c0, 940b615114b3e4df189739e06f770c67246499a9, 82ad7e7739464602794e2aa325dd18d2837ef5f6">
            </div>
        </div>

        <textarea id="domainInput" placeholder="example1.com&#10;example2.com&#10;techblog.com"></textarea>
        
        <div class="action-bars">
            <button onclick="findEmails()">Extract & Verify Emails</button>
            <label for="csvFileInput" class="csv-btn">
                📁 Import CSV
            </label>
            <input type="file" id="csvFileInput" accept=".csv, .txt" onchange="handleCSVImport(event)">
        </div>
        
        <div class="results" id="resultsContainer"></div>
    </div>

    <script>
        // CSV Import Handler
        function handleCSVImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                const domains = [];

                lines.forEach(line => {
                    let clean = line.replace(/["']/g, '').split(',')[0].trim();
                    if (clean && !clean.toLowerCase().includes('domain') && !clean.toLowerCase().includes('website')) {
                        domains.push(clean);
                    }
                });

                if (domains.length > 0) {
                    document.getElementById('domainInput').value = domains.join('\n');
                    alert(`${domains.length} domains CSV se successfully import ho gaye hain!`);
                } else {
                    alert("CSV file mein koi valid domain nahi mila.");
                }
            };
            reader.readAsText(file);
        }

        async function findEmails() {
            const input = document.getElementById('domainInput').value;
            const domains = input.split('\n').map(d => d.trim()).filter(d => d);
            const serperApiKey = document.getElementById('serperKey').value.trim();
            const container = document.getElementById('resultsContainer');
            
            if (domains.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #f43f5e; padding: 15px;">Kam az kam ek website/domain enter karein!</div>';
                return;
            }

            container.innerHTML = '<div class="loading">Live search & extraction jari hai, baraye meherbani intezaar karein...</div>';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domains, serperApiKey })
                });
                const data = await response.json();
                
                container.innerHTML = '';
                if (data.results) {
                    data.results.forEach(res => {
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        
                        let emailsHTML = '';
                        if (res.emails && res.emails.length > 0) {
                            emailsHTML = `<div class="email-list">` + res.emails.map(e => `<span class="email-tag">✉️ ${e}</span>`).join('') + `</div>`;
                        } else {
                            emailsHTML = `<span class="no-email">❌ Active contact email nahi mili</span>`;
                        }

                        card.innerHTML = `
                            <div class="domain-title">🌐 ${res.target}</div>
                            <div>${emailsHTML}</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div style="text-align: center; color: #f43f5e; padding: 15px;">API response sahi nahi mila.</div>';
                }
            } catch (err) {
                container.innerHTML = '<div style="text-align: center; color: #f43f5e; padding: 15px;">Data process karne mein koi error aa gaya hai.</div>';
            }
        }
    </script>
</body>
</html>
